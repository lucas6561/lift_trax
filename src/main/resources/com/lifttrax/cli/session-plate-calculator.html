<details class='session-guidance' data-pane='plates'>
  <summary>Plate Calculator</summary>
  <div class='session-plates'>
    <label>Bar weight
      <select class='js-session-bar'>
        {{SESSION_BAR_WEIGHT_OPTIONS}}
      </select>
    </label>
    <p class='js-session-plates-result' role='status' aria-live='polite' aria-atomic='true'>Live plate calculation requires JavaScript.</p>
    <div class='js-session-plates-visual session-plates-visual is-hidden' aria-hidden='true'></div>
    <p class='muted session-plates-assumptions'>Uses your logging weight. Assumes enough pairs of 45, 25, 10, 5, 2.5, and 0.5 lb plates. Collars are excluded.</p>
  </div>
</details>
