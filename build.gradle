plugins {
    id 'application'
    id 'jacoco'
    id 'pmd'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.lifttrax'
version = '0.1.0'


java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

configurations {
    javascriptCpdTool
}

sourceSets {
    main {
        resources {
            srcDir 'shared'
        }
    }
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.16'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testImplementation 'com.h2database:h2:2.3.232'
    testImplementation 'com.tngtech.archunit:archunit:1.5.0'
    testImplementation 'net.sourceforge.pmd:pmd-java:7.13.0'
    testImplementation 'net.sourceforge.pmd:pmd-javascript:7.13.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'

    // Gradle stops adding its default PMD dependency when a module is declared here,
    // so keep both language implementations explicit and on the same pinned version.
    pmd 'net.sourceforge.pmd:pmd-ant:7.13.0'
    pmd 'net.sourceforge.pmd:pmd-java:7.13.0'
    pmd 'net.sourceforge.pmd:pmd-javascript:7.13.0'

    javascriptCpdTool 'net.sourceforge.pmd:pmd-ant:7.13.0'
    javascriptCpdTool 'net.sourceforge.pmd:pmd-cli:7.13.0'
    javascriptCpdTool 'net.sourceforge.pmd:pmd-javascript:7.13.0'
    javascriptCpdTool 'org.slf4j:slf4j-simple:1.7.36'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'lifttrax.mainClasses', sourceSets.main.output.classesDirs.asPath
    finalizedBy tasks.named('jacocoTestReport')

    jacoco {
        excludes = ['java.*', 'javax.*', 'jdk.*', 'sun.*']
    }
}

tasks.named('compileTestJava') {
    // JDK 24 javac in this Windows environment does not resolve the exploded main output
    // directory reliably during test compilation, so compile main sources with tests too.
    source sourceSets.main.java
}

jacoco {
    toolVersion = '0.8.14'
}



spotless {
    java {
        googleJavaFormat('1.30.0')
        target 'src/*/java/**/*.java'
    }
}

pmd {
    toolVersion = "7.13.0"
    consoleOutput = true
    ignoreFailures = false

    // Only use our custom ruleset
    ruleSetFiles = files("config/pmd/ruleset.xml")
    ruleSets = []
}

tasks.withType(Pmd).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('pmdJavascriptCompatibility', JavaExec) {
    group = 'verification'
    description = 'Records PMD/Rhino compatibility evidence for every maintained browser script.'
    classpath = configurations.javascriptCpdTool
    mainClass = 'net.sourceforge.pmd.cli.PmdCli'
    def report = layout.buildDirectory.file('reports/pmd/javascriptCompatibility.xml')
    def diagnostics = layout.buildDirectory.file('reports/javascript/static-analysis/pmd-compatibility-diagnostics.log')
    inputs.files(fileTree('src/main/resources/com/lifttrax/cli/browser') {
        include '**/*.js'
    })
    inputs.file('config/pmd/ruleset-javascript.xml')
    outputs.files(report, diagnostics)
    args 'check',
        '--dir', file('src/main/resources/com/lifttrax/cli/browser').path,
        '--rulesets', file('config/pmd/ruleset-javascript.xml').path,
        '--format', 'xml',
        '--report-file', report.get().asFile.path,
        '--relativize-paths-with', projectDir.path,
        '--no-fail-on-violation',
        '--no-fail-on-error'
    def diagnosticStream = null
    doFirst {
        report.get().asFile.parentFile.mkdirs()
        diagnostics.get().asFile.parentFile.mkdirs()
        diagnosticStream = new FileOutputStream(diagnostics.get().asFile)
        standardOutput = diagnosticStream
        errorOutput = diagnosticStream
    }
    doLast {
        diagnosticStream.close()
    }
}

tasks.register('javascriptPmdCompatibilitySummary', Exec) {
    group = 'verification'
    description = 'Validates and summarizes PMD/Rhino modern-JavaScript compatibility evidence.'
    dependsOn 'pmdJavascriptCompatibility'
    commandLine 'node', 'scripts/javascript-pmd-compatibility.mjs'
}

tasks.register('javascriptLint', Exec) {
    group = 'verification'
    description = 'Runs pinned ESLint policies over production and test/harness JavaScript.'
    def requestedFiles = providers.gradleProperty('javascriptAnalysisFiles')
    def reportDirectory = providers.gradleProperty('javascriptAnalysisReportDirectory')
        .orElse('build/reports/javascript/static-analysis')
    commandLine 'node', 'scripts/javascript-static-analysis.mjs'
    if (requestedFiles.isPresent()) {
        args requestedFiles.get().split(';')
    }
    environment 'LIFTTRAX_JAVASCRIPT_ANALYSIS_REPORT_DIRECTORY', reportDirectory.get()
}

tasks.register('javascriptCpd') {
    group = 'verification'
    description = 'Detects maintained JavaScript duplication with PMD CPD.'
    def productionSources = fileTree('src/main/resources/com/lifttrax/cli/browser') {
        include '**/*.js'
    }
    def infrastructureSources = fileTree('scripts') {
        include '**/*.mjs'
    }
    def reportDirectory = layout.buildDirectory.dir('reports/javascript/static-analysis')
    inputs.files(productionSources, infrastructureSources)
    outputs.files(
        reportDirectory.map { it.file('cpd.xml') },
        reportDirectory.map { it.file('cpd.txt') }
    )
    doLast {
        def output = reportDirectory.get().asFile
        output.mkdirs()
        ant.taskdef(
            name: 'javascriptCpd',
            classname: 'net.sourceforge.pmd.ant.CPDTask',
            classpath: configurations.javascriptCpdTool.asPath
        )
        ['xml', 'text'].each { format ->
            ant.javascriptCpd(
                minimumTokenCount: 100,
                language: 'ecmascript',
                encoding: 'UTF-8',
                format: format,
                outputFile: new File(output, "cpd.${format == 'text' ? 'txt' : format}"),
                failOnError: true
            ) {
                fileset(dir: 'src/main/resources/com/lifttrax/cli/browser') {
                    include(name: '**/*.js')
                }
                fileset(dir: 'scripts') {
                    include(name: '**/*.mjs')
                }
            }
        }
        def report = new File(output, 'cpd.xml').getText('UTF-8')
        if (report.contains('<duplication ')) {
            throw new GradleException("JavaScript CPD found a duplicate of at least 100 tokens; see ${new File(output, 'cpd.txt')}")
        }
        def textReport = new File(output, 'cpd.txt')
        if (textReport.length() == 0) {
            textReport.setText('No maintained JavaScript duplicates of at least 100 tokens found.\n', 'UTF-8')
        }
    }
}

tasks.register('javascriptStaticAnalysis') {
    group = 'verification'
    description = 'Runs JavaScript compatibility, lint, size/complexity, and duplicate-code policies.'
    dependsOn 'javascriptPmdCompatibilitySummary'
    dependsOn 'javascriptLint'
    dependsOn 'javascriptCpd'
    dependsOn 'javascriptStaticAnalysisProbes'
}

tasks.register('javascriptStaticAnalysisProbes', Exec) {
    group = 'verification'
    description = 'Proves representative JavaScript analysis failures have actionable diagnostics.'
    commandLine 'node', 'scripts/javascript-static-analysis-probes.mjs'
    doFirst {
        environment 'LIFTTRAX_JAVA', new File(System.getProperty('java.home'), 'bin/java').path
        environment 'LIFTTRAX_CPD_CLASSPATH', configurations.javascriptCpdTool.asPath
    }
}

pitest {
    targetClasses = [
        'com.lifttrax.workout.ConjugateWorkoutBuilder',
        'com.lifttrax.workout.WaveMarkdownWriter',
        'com.lifttrax.cli.PlannedWorkoutSessionService',
        'com.lifttrax.cli.WeightInputParser',
        'com.lifttrax.cli.ExecutionSetFormValues'
    ]
    targetTests = [
        'com.lifttrax.workout.*Test',
        'com.lifttrax.cli.PlannedWorkoutSessionServiceTest',
        'com.lifttrax.cli.WeightInputParserTest',
        'com.lifttrax.cli.ExecutionInputWidgetCoverageTest',
        'com.lifttrax.cli.WebUiRendererTest'
    ]
    pitestVersion = '1.22.1'
    junit5PluginVersion = '1.2.3'
    threads = 4
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    mutationThreshold = 60
    coverageThreshold = 80
    jvmArgs = ['-Djava.awt.headless=true']
}

tasks.register('staticAnalysis') {
    group = 'verification'
    description = 'Runs PMD static analysis with a strict threshold.'
    dependsOn tasks.named('pmdMain')
    dependsOn tasks.named('pmdTest')
}

tasks.register('qualityGate') {
    group = 'verification'
    description = 'Runs formatting, static analysis, tests, and coverage verification.'
    dependsOn tasks.named('spotlessCheck')
    dependsOn tasks.named('staticAnalysis')
    dependsOn tasks.named('test')
    dependsOn tasks.named('jacocoTestCoverageVerification')
    dependsOn 'javascriptTest'
    dependsOn 'javascriptStaticAnalysis'
}

tasks.register('javascriptFixtures', JavaExec) {
    group = 'verification'
    description = 'Renders disposable production HTML for JavaScript behavior tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lifttrax.cli.ApplicationShellBrowserFixture'
    args '--export-fixtures', layout.buildDirectory.dir('javascript-fixtures').get().asFile.path
    inputs.files(sourceSets.main.allSource, sourceSets.test.allSource)
    outputs.dir(layout.buildDirectory.dir('javascript-fixtures'))
}

tasks.register('javascriptTest', Exec) {
    group = 'verification'
    description = 'Runs Node JavaScript syntax, DOM behavior, and coverage checks.'
    dependsOn 'javascriptFixtures'
    commandLine 'node', 'scripts/javascript-test.mjs'
}

tasks.register('browserAcceptance', Exec) {
    group = 'verification'
    description = 'Runs isolated desktop/mobile Chromium acceptance scenarios.'
    dependsOn 'testClasses'
    commandLine 'node', 'scripts/browser-acceptance.mjs'
    if (providers.gradleProperty('browserSuite').isPresent()) {
        args providers.gradleProperty('browserSuite').get()
    }
    doFirst {
        environment 'LIFTTRAX_BROWSER_CLASSPATH', sourceSets.test.runtimeClasspath.asPath
        environment 'LIFTTRAX_JAVA', new File(System.getProperty('java.home'), 'bin/java').path
    }
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
    dependsOn tasks.named('staticAnalysis')
    dependsOn tasks.named('qualityGate')
}

application {
    mainClass = 'com.lifttrax.cli.DumpDatabaseCli'
}

tasks.named('run') {
    description = 'Prints a user-scoped Postgres catalog and execution history.'
    systemProperty 'lifttrax.config', 'config/lifttrax-local.properties'
}

tasks.register('runWeb', JavaExec) {
    group = 'application'
    description = 'Runs the embedded HTTP server with configured Postgres and local auth.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lifttrax.cli.WebServerCli'
    systemProperty 'lifttrax.config', 'config/lifttrax-local.properties'
}

tasks.register('runHostedWeb', JavaExec) {
    group = 'application'
    description = 'Runs the embedded HTTP server with configured Postgres and hosted config.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lifttrax.cli.WebServerCli'
    systemProperty 'lifttrax.config', 'config/lifttrax-hosted.properties'
}

tasks.register('runBrowserFixture', JavaExec) {
    group = 'verification'
    description = 'Runs an isolated H2-backed web fixture for authenticated browser checks.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lifttrax.cli.ApplicationShellBrowserFixture'
}

tasks.register('postgresSqliteBackup', JavaExec) {
    group = 'application'
    description = 'Creates a validated point-in-time SQLite snapshot of Postgres.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lifttrax.cli.PostgresSqliteBackupCli'
    systemProperty 'lifttrax.config', 'config/lifttrax-hosted.properties'
}

tasks.register('importHostedDatabase', JavaExec) {
    group = 'application'
    description = 'Imports a local LiftTrax SQLite database into the configured hosted account.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lifttrax.cli.ImportHostedDatabaseCli'
    systemProperty 'lifttrax.config', 'config/lifttrax-hosted.properties'
}

tasks.register('postgresRecovery', JavaExec) {
    group = 'application'
    description = 'Restores a validated snapshot into an explicitly configured empty isolated Postgres target.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lifttrax.cli.PostgresRecoveryCli'
}

tasks.register('generateWave', JavaExec) {
    group = 'application'
    description = 'Generates a planned workout from a user-scoped Postgres catalog.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.lifttrax.cli.WaveCli'
    systemProperty 'lifttrax.config', 'config/lifttrax-local.properties'
}


tasks.named('pmdTest') {
    ruleSetFiles = files('config/pmd/ruleset-test.xml')
}
