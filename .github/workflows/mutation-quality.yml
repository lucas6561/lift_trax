name: Mutation Quality

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: mutation-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-quality:
    name: PIT Mutation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run ratcheted mutation gate
        run: ./gradlew mutationGate
      - name: Preserve mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          if-no-files-found: warn
          path: build/reports/pitest/
